name: Make Release

on:
  push:
    tags: 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Source Code Download
        run: git clone --branch master --single-branch --recurse-submodules https://github.com/tugaia56/Oxydian-xposed.git .

      - name: set up JDK 17
        uses: actions/setup-java@v4.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Shell Scripts Permissions
        run: chmod +x .github/*.sh

      - name: Version Bump
        run: .github/bumpVersion.sh

      - name: Extract Changes
        run: .github/extractChanges.sh

      - name: Gradlew Permissions
        run: chmod +x gradlew

      - name: Signature files preparation
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo storePassword=$KS_PASSWORD >> keystore.properties
            echo keyAlias=$KS_ALIAS >> keystore.properties
            echo keyPassword=$KS_KEY_PASSWORD >> keystore.properties
            echo storeFile=${{ github.workspace }}/key.jks >> keystore.properties
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > ${{ github.workspace }}/key.jks
          fi

      - name: Gradle Build
        run: ./gradlew assembleRelease

      - name: Upload Artifact to Actions
        uses: actions/upload-artifact@v4.3.1
        with:
          name: "Oxydian_${{ env.VTag }}"
          path: app/build/outputs/apk/release/${{ env.ApkName }}

      - name: Version Bump Commit
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: 'master'
          commit-message: 'Version update: Release'
          force-add: 'true'
          files: app/build.gradle.kts
          name: GitHub
          email: obsidian@tugaia.it

      - name: Oxydian Binary Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ env.VTag }}
          name: ${{ env.VName }}
          body: ${{ env.Body }}
          prerelease: false
          allowUpdates: false
          draft: false
          artifacts: 'app/build/outputs/apk/release/${{ env.ApkName }}'

      - name: Telegram Group Post
        if: ${{ success() && vars.HAS_TELEGRAM_SECRETS == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TK }}
          TG_CHAT: ${{ secrets.OBSIDIAN_GROUP }}
        run: |
          TG_TOKEN=$(printf %s "$TG_TOKEN" | grep -oE '[0-9]+:[A-Za-z0-9_-]{30,}' | head -1)
          TG_CHAT=$(printf %s "$TG_CHAT" | grep -oE '[-]?[0-9]+' | head -1)
          for f in $(ls telegram_*.msg | sort -V); do
            curl -s -X POST \
              -F "chat_id=$TG_CHAT" \
              -F "text=<$f" \
              "https://api.telegram.org/bot$TG_TOKEN/sendMessage"
            echo
          done
          curl -s -X POST \
            -F "chat_id=$TG_CHAT" \
            -F "caption=${{ env.VName }}" \
            -F "document=@app/build/outputs/apk/release/${{ env.ApkName }}" \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
