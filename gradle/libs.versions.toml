[versions]
agp          = "9.4.0"
java         = "17"
compileSdk   = "35"
minSdk       = "31"
targetSdk    = "35"
appcompat    = "1.7.0"
material     = "1.12.0"
eventbus     = "3.3.1"
colorpicker  = "1.1.0"
recyclerView = "1.3.2"
libsu        = "5.2.2"
biometric    = "1.1.0"
remoteprefs  = "0.8"
documentfile = "1.0.1"
kotlin       = "2.2.10"
lottie       = "6.6.0"
bcpkix       = "1.84"
work         = "2.9.1"

[libraries]
android-appcompat    = { group = "androidx.appcompat",              name = "appcompat",           version.ref = "appcompat"    }
android-material     = { group = "com.google.android.material",     name = "material",            version.ref = "material"     }
android-recyclerview = { group = "androidx.recyclerview",           name = "recyclerview",        version.ref = "recyclerView" }
eventbus             = { group = "org.greenrobot",                  name = "eventbus",            version.ref = "eventbus"     }
colorpicker          = { group = "com.jaredrummler",                name = "colorpicker",         version.ref = "colorpicker"  }
libsu-core           = { group = "com.github.topjohnwu.libsu",      name = "core",                version.ref = "libsu"        }
libsu-service        = { group = "com.github.topjohnwu.libsu",      name = "service",             version.ref = "libsu"        }
android-biometric    = { group = "androidx.biometric",              name = "biometric",           version.ref = "biometric"    }
remotepreferences    = { group = "com.crossbowffs.remotepreferences", name = "remotepreferences", version.ref = "remoteprefs"  }
android-documentfile = { group = "androidx.documentfile",            name = "documentfile",       version.ref = "documentfile" }
lottie               = { group = "com.airbnb.android",               name = "lottie",             version.ref = "lottie"       }
bcpkix               = { group = "org.bouncycastle",                 name = "bcpkix-jdk18on",     version.ref = "bcpkix"       }
work-runtime         = { group = "androidx.work",                    name = "work-runtime",       version.ref = "work"         }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
